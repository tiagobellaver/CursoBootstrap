<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Fill, Grow and Shrink</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/exemple.css">
</head>
<body>
    
    <div class="container">

        <div class="d-flex bg">

            <div class="bg flex-fill p-2">Hcode Treinamentos</div>
            <div class="bg flex-fill p-2">2</div>
            <div class="bg flex-fill p-2">3</div>

        </div>

        <div class="d-flex bg">

            <div class="bg flex-grow-1 p-2">1</div>
            <div class="bg p-2">2</div>
            <div class="bg p-2">3</div>

        </div>

        <div class="d-flex bg">

            <div class="bg flex-shrink-1 p-2">1</div>
            <div class="bg w-100 p-2">2</div>

        </div>

    </div>

</body>
</html>
